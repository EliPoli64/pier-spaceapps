<?xml version="1.0" standalone="no"?>
<svg id="pier-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-label="PiER Brand Logo" class="overflow-visible">
        <defs>
          <!-- Overall Logo Soft Ambient Shadow -->
          <filter id="logoDropShadow" x="-10%" y="-10%" width="125%" height="130%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030D17" flood-opacity="0.48"/>
          </filter>

          <!-- Shield Outer Rim Gradient -->
          <linearGradient id="shieldRimGrad" x1="25%" y1="5%" x2="80%" y2="95%">
            <stop offset="0%" stop-color="#B9FBD5"/>
            <stop offset="35%" stop-color="#9FF5C2"/>
            <stop offset="75%" stop-color="#79DC9F"/>
            <stop offset="100%" stop-color="#8CEEB3"/>
          </linearGradient>

          <!-- Shield Inner Bevel Highlight -->
          <linearGradient id="shieldBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D7FDE8" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#79DC9F" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#489E7C" stop-opacity="0.5"/>
          </linearGradient>

          <!-- Vortex Upper Crest Gradient (Bright Mint) -->
          <linearGradient id="vortexBrightGrad" x1="15%" y1="10%" x2="85%" y2="85%">
            <stop offset="0%" stop-color="#C2FDE0"/>
            <stop offset="52%" stop-color="#7CE8B4"/>
            <stop offset="100%" stop-color="#45A888"/>
          </linearGradient>

          <!-- Vortex Mid-Tone Teal Gradient -->
          <linearGradient id="vortexMidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9BF5C6"/>
            <stop offset="55%" stop-color="#58BD95"/>
            <stop offset="100%" stop-color="#317D6B"/>
          </linearGradient>

          <!-- Vortex Deep Inner Core Gradient -->
          <linearGradient id="vortexDeepGrad" x1="15%" y1="5%" x2="90%" y2="95%">
            <stop offset="0%" stop-color="#7AE5B1"/>
            <stop offset="55%" stop-color="#45A888"/>
            <stop offset="100%" stop-color="#287364"/>
          </linearGradient>

          <!-- Vortex Highlight Rim Gradient -->
          <linearGradient id="vortexRimHighlight" x1="0%" y1="0%" x2="100%" y2="60%">
            <stop offset="0%" stop-color="#D7FEEE"/>
            <stop offset="65%" stop-color="#98F3C3"/>
            <stop offset="100%" stop-color="#55B991"/>
          </linearGradient>

          <!-- Sweeping Arrow Upper Face (Luminous Mint) -->
          <linearGradient id="arrowTopGrad" x1="5%" y1="45%" x2="95%" y2="25%">
            <stop offset="0%" stop-color="#A7F7C8"/>
            <stop offset="45%" stop-color="#95F0BA"/>
            <stop offset="80%" stop-color="#B6FAD2"/>
            <stop offset="100%" stop-color="#98F1BC"/>
          </linearGradient>

          <!-- Sweeping Arrow Lower 3D Underside / Extrusion -->
          <linearGradient id="arrowSideGrad" x1="0%" y1="30%" x2="100%" y2="70%">
            <stop offset="0%" stop-color="#58B38B"/>
            <stop offset="55%" stop-color="#4B9E7B"/>
            <stop offset="100%" stop-color="#68C899"/>
          </linearGradient>

          <!-- Pillar Front-Left Face (Lit Mint) -->
          <linearGradient id="pillarLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9CF3C0"/>
            <stop offset="100%" stop-color="#76D69E"/>
          </linearGradient>

          <!-- Pillar Right 3D Shadow Face (Deep Teal) -->
          <linearGradient id="pillarShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4A9D7A"/>
            <stop offset="100%" stop-color="#387D62"/>
          </linearGradient>

          <!-- Wordmark Gradient: Crisp White Top to Pale Mint Bottom -->
          <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="52%" stop-color="#F6FEFA"/>
            <stop offset="100%" stop-color="#D8F9E8"/>
          </linearGradient>

          <!-- Tornado gradient: light mint at the top of the funnel to deep teal at the tip (artwork coordinates) -->
          <linearGradient id="tornadoGrad" gradientUnits="userSpaceOnUse" x1="0" y1="11400" x2="0" y2="1400">
            <stop offset="0%" stop-color="#C9FEE3"/>
            <stop offset="35%" stop-color="#8DF0BC"/>
            <stop offset="70%" stop-color="#52B78F"/>
            <stop offset="100%" stop-color="#2C7A68"/>
          </linearGradient>

          <!-- Inner Shield Clip Path for Clean Architectural Pillar & Arrow Alignment -->
          <clipPath id="shieldInnerClip">
            <path d="M 168 62&#xA;                     C 198 80, 232 91, 266 96&#xA;                     L 266 155&#xA;                     C 266 226, 224 274, 168 302&#xA;                     C 112 274, 70 226, 70 155&#xA;                     L 70 96&#xA;                     C 104 91, 138 80, 168 62 Z"/>
          </clipPath>
        </defs>

        <!-- Complete Logo Group with Drop Shadow -->
        <g filter="url(#logoDropShadow)">

          <!-- ============================================================
               1. LEFT HERALDIC SHIELD EMBLEM
               ============================================================ -->
          <g id="pier-shield-emblem">

            <!-- Outer Shield Frame with Upper-Right Arrow Notch -->
            <!-- Starts at top apex (168, 42), goes right to notch (284, 83 -> 284, 96 -> 266, 102),
                 resumes below arrow head at (266, 148 -> 284, 138) down to bottom apex (168, 322),
                 and up the left side back to (168, 42) -->
            <path d="M 168 42&#xA;                 C 202 63, 240 76, 284 83&#xA;                 L 284 96&#xA;                 L 266 104&#xA;                 L 266 96&#xA;                 C 231 90, 198 79, 168 61&#xA;                 C 138 79, 105 90, 70 96&#xA;                 L 70 156&#xA;                 C 70 226, 111 273, 168 302&#xA;                 C 221 275, 261 232, 265 168&#xA;                 L 283 157&#xA;                 C 278 234, 232 288, 168 322&#xA;                 C 101 287, 52 229, 52 156&#xA;                 L 52 83&#xA;                 C 96 76, 134 63, 168 42 Z" fill="url(#shieldRimGrad)"/>

            <!-- Subtle Inner Rim Bevel Highlight -->
            <path d="M 168 42&#xA;                 C 202 63, 240 76, 284 83&#xA;                 L 284 86&#xA;                 C 240 79, 202 66, 168 45&#xA;                 C 134 66, 96 79, 52 86&#xA;                 L 52 83&#xA;                 C 96 76, 134 63, 168 42 Z" fill="url(#shieldBevelGrad)"/>

            <!-- Clipped Interior Elements (Pillars + Vortex + Sweeping Arrow) -->
            <g clip-path="url(#shieldInnerClip)">

              <!-- A. THREE PIER / BAR-CHART COLUMNS UNDER THE ARROW -->
              <!-- Column 1 (Left / Shortest) -->
              <g id="pier-pillar-1">
                <!-- Lit Left Face -->
                <polygon points="103,242 117,238 117,282 103,272" fill="url(#pillarLightGrad)"/>
                <!-- Shaded Right 3D Face -->
                <polygon points="117,238 126,236 126,288 117,282" fill="url(#pillarShadowGrad)"/>
              </g>

              <!-- Column 2 (Center / Medium) -->
              <g id="pier-pillar-2">
                <!-- Lit Left Face -->
                <polygon points="145,224 160,217 160,304 145,296" fill="url(#pillarLightGrad)"/>
                <!-- Shaded Right 3D Face -->
                <polygon points="160,217 170,212 170,304 160,304" fill="url(#pillarShadowGrad)"/>
              </g>

              <!-- Column 3 (Right / Tallest) -->
              <g id="pier-pillar-3">
                <!-- Lit Left Face -->
                <polygon points="190,198 206,186 206,292 190,300" fill="url(#pillarLightGrad)"/>
                <!-- Shaded Right 3D Face -->
                <polygon points="206,186 216,178 216,284 206,292" fill="url(#pillarShadowGrad)"/>
              </g>

              <!-- B. TORNADO (imported vector artwork, recoloured with the brand mint-to-teal gradient) -->
              <g id="pier-vortex" transform="translate(150 88) scale(0.1033) translate(-745 0)">
                <g transform="translate(0,1142) scale(0.1,-0.1)" fill="url(#tornadoGrad)" stroke="none">
                  <path d="M8870 11409 c0 -6 33 -44 73 -83 105 -103 171 -133 467 -211 361 -96&#xA;831 -288 1193 -488 448 -247 754 -510 929 -798 165 -272 185 -596 53 -886 -83&#xA;-181 -179 -314 -390 -539 l-120 -128 -7 90 c-23 269 -108 515 -250 722 -101&#xA;146 -293 329 -473 449 -293 196 -742 369 -1230 474 -150 32 -455 86 -455 81 0&#xA;-3 18 -29 40 -59 84 -111 253 -235 640 -468 281 -170 461 -291 573 -385 293&#xA;-245 385 -484 287 -738 -93 -242 -378 -525 -714 -708 l-68 -37 8 54 c5 30 9&#xA;119 9 199 -1 166 -18 247 -81 373 -174 347 -576 574 -960 542 l-88 -7 55 -52&#xA;c30 -28 112 -100 184 -161 203 -173 294 -296 330 -446 27 -116 14 -214 -44&#xA;-327 -132 -254 -520 -488 -1042 -626 -800 -211 -1789 -228 -2689 -46 -618 125&#xA;-992 318 -1116 577 -86 178 -45 394 101 538 83 82 183 140 403 231 287 118&#xA;372 166 462 258 54 56 58 56 -160 15 -662 -122 -1105 -324 -1279 -584 -121&#xA;-181 -126 -377 -16 -612 24 -51 42 -93 41 -93 -17 0 -284 98 -339 125 -281&#xA;133 -540 353 -629 532 -43 86 -43 88 -43 192 0 101 2 110 36 181 116 244 371&#xA;441 1024 790 283 152 497 273 543 308 l35 27 -69 12 c-99 18 -388 17 -515 -1&#xA;-795 -113 -1496 -520 -1741 -1011 -73 -146 -103 -275 -101 -442 0 -68 -2 -123&#xA;-4 -123 -14 0 -132 78 -210 139 -175 136 -317 309 -384 469 -47 115 -61 198&#xA;-57 337 4 102 10 134 37 217 72 211 226 409 461 588 448 342 1067 617 1797&#xA;800 211 52 449 102 643 135 85 14 167 28 183 31 27 6 27 6 27 89 l0 83 -37 -4&#xA;c-21 -2 -105 -8 -188 -14 -1164 -85 -2325 -425 -3191 -936 -419 -247 -682&#xA;-537 -780 -860 -23 -77 -27 -107 -28 -224 0 -112 3 -149 22 -215 100 -352 435&#xA;-694 917 -937 183 -92 345 -158 618 -253 l209 -72 47 -89 c265 -502 755 -875&#xA;1631 -1241 1099 -460 2250 -789 3345 -957 505 -78 861 -107 1388 -113 425 -5&#xA;651 2 952 33 253 25 1069 143 1280 185 855 169 1316 503 1515 1097 22 64 38&#xA;118 36 119 -1 2 -104 -48 -227 -110 -871 -438 -1713 -661 -2864 -759 -203 -17&#xA;-1046 -17 -1265 0 -769 61 -1373 158 -2075 333 -931 233 -2071 662 -2585 974&#xA;-121 73 -430 279 -425 283 1 2 49 -10 106 -27 783 -227 1748 -379 2786 -441&#xA;865 -51 2217 -23 2963 60 1098 124 2060 377 2985 786 839 371 1280 788 1412&#xA;1336 24 99 24 325 0 425 -62 262 -194 481 -428 709 -163 158 -317 273 -587&#xA;436 -706 427 -1715 752 -2677 863 -77 8 -157 18 -177 21 -27 4 -38 2 -38 -7z"/>
                  <path d="M6036 8214 c-458 -47 -804 -120 -1073 -225 l-105 -41 6 -31 c16 -77&#xA;80 -181 166 -268 200 -202 480 -297 973 -331 195 -13 496 -2 752 27 188 22&#xA;603 92 720 122 252 64 401 191 399 340 -2 120 -124 217 -370 292 -174 53 -233&#xA;61 -804 116 -187 18 -487 18 -664 -1z"/>
                  <path d="M12234 7982 c-103 -85 -305 -234 -444 -328 -894 -601 -1929 -958&#xA;-3273 -1129 -814 -103 -1870 -165 -2172 -127 -55 7 -235 31 -400 52 -409 53&#xA;-496 61 -702 61 -182 0 -273 -8 -401 -36 -80 -16 -209 -58 -251 -80 l-26 -13&#xA;25 -6 c67 -15 629 -95 990 -140 824 -104 1463 -148 2165 -148 845 0 1533 69&#xA;2270 227 1079 232 1693 550 2030 1050 56 84 155 284 184 375 24 73 72 282 67&#xA;287 -2 2 -30 -18 -62 -45z"/>
                  <path d="M2605 6403 c87 -151 265 -385 417 -549 869 -941 2272 -1483 4278&#xA;-1654 530 -45 1147 -63 1935 -57 650 4 727 9 991 57 396 71 697 227 880 454&#xA;75 93 163 263 194 376 22 79 52 251 46 258 -2 2 -62 -32 -133 -74 -587 -354&#xA;-1268 -557 -2103 -625 -187 -16 -727 -16 -945 0 -1037 72 -2119 324 -3329 777&#xA;-434 163 -598 239 -926 432 -102 59 -279 164 -395 232 -262 153 -477 263 -642&#xA;328 -112 44 -261 92 -286 92 -5 0 3 -21 18 -47z"/>
                  <path d="M4687 4303 l-37 -4 77 -90 c459 -537 1362 -977 2288 -1114 376 -56&#xA;856 -60 1165 -9 385 63 712 183 978 361 98 66 229 172 291 237 l35 36 -130 0&#xA;c-134 0 -409 -16 -833 -50 -443 -34 -664 -43 -956 -37 -570 12 -765 56 -1575&#xA;355 -519 191 -718 251 -962 291 -129 21 -277 31 -341 24z"/>
                  <path d="M4927 3503 c19 -191 112 -361 303 -554 118 -119 324 -286 479 -391&#xA;449 -301 1116 -441 1731 -362 469 60 841 231 1120 513 l94 96 -554 6 c-585 6&#xA;-729 11 -1005 35 -840 70 -1456 261 -2062 640 -55 35 -103 64 -106 64 -2 0 -2&#xA;-21 0 -47z"/>
                  <path d="M4990 2468 c0 -121 34 -222 115 -343 126 -190 453 -462 692 -576 202&#xA;-96 409 -146 643 -156 423 -16 807 127 1087 405 71 71 160 179 152 186 -10 9&#xA;-284 27 -555 36 -696 24 -893 40 -1139 95 -307 68 -639 212 -912 396 -40 27&#xA;-75 49 -78 49 -3 0 -5 -42 -5 -92z"/>
                  <path d="M4790 1391 c0 -17 60 -181 101 -274 79 -183 234 -424 397 -617 101&#xA;-120 309 -323 432 -422 l95 -77 6 27 c4 15 14 63 22 107 34 186 117 332 314&#xA;554 164 185 261 307 311 391 24 40 42 74 40 76 -2 2 -55 -1 -118 -6 -242 -20&#xA;-546 -10 -755 26 -204 34 -481 106 -724 189 -114 38 -121 40 -121 26z"/>
                </g>
              </g>

              <!-- C. DIMENSIONAL SWEEPING GROWTH ARROW (Inside Clip) -->
              <!-- Lower 3D Extruded Shadow Band of the Arrow Curve -->
              <path d="M 66 162&#xA;                   C 76 208, 108 228, 152 216&#xA;                   C 188 206, 222 178, 254 140&#xA;                   L 254 153&#xA;                   C 220 192, 184 221, 145 231&#xA;                   C 98 243, 66 218, 62 172 Z" fill="url(#arrowSideGrad)"/>

              <!-- Upper Lit Mint Face of the Arrow Curve -->
              <path d="M 66 135&#xA;                   C 72 184, 104 208, 148 197&#xA;                   C 185 188, 218 161, 246 125&#xA;                   L 256 138&#xA;                   C 224 177, 189 206, 151 217&#xA;                   C 105 229, 71 206, 65 156 Z" fill="url(#arrowTopGrad)"/>

              <!-- Subtle Inner Bevel Crease Along Arrow Spine -->
              <path d="M 74 176&#xA;                   C 91 206, 121 216, 154 206&#xA;                   C 187 196, 218 171, 249 133" fill="none" stroke="#D4FDE5" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
            </g>

            <!-- D. SHARP ARROWHEAD EMERGING THROUGH UPPER-RIGHT SHIELD GAP -->
            <g id="pier-arrowhead">
              <!-- Arrowhead 3D Right/Bottom Wing Shadow -->
              <polygon points="284,105 274,158 263,146 271,116" fill="url(#arrowSideGrad)"/>
              <!-- Arrowhead Main Lit Face -->
              <polygon points="234,117 284,105 271,118 263,146 254,136 244,126" fill="url(#arrowTopGrad)"/>
              <!-- Crisp Highlight Edge on Arrowhead Tip -->
              <polyline points="234,117 284,105 274,158" fill="none" stroke="#D9FEE9" stroke-width="1.4" stroke-linejoin="round" opacity="0.85"/>
            </g>
          </g>

          <!-- ============================================================
               2. RIGHT WORDMARK ('PiER') - BESPOKE GEOMETRIC VECTOR PATHS
               Cap Height: Y = 116 to Y = 250 (134px tall)
               ============================================================ -->
          <g id="pier-wordmark" fill="url(#wordmarkGrad)">

            <!-- Letter 'P' -->
            <!-- Vertical stem x=326..354, Bowl outer radius curving smoothly to x=430 -->
            <path d="M 326 116&#xA;                 L 386 116&#xA;                 C 414 116, 431 132, 431 158&#xA;                 C 431 184, 414 200, 386 200&#xA;                 L 354 200&#xA;                 L 354 250&#xA;                 L 326 250&#xA;                 Z&#xA;                 M 354 139&#xA;                 L 354 177&#xA;                 L 383 177&#xA;                 C 396 177, 403 170, 403 158&#xA;                 C 403 146, 396 139, 383 139&#xA;                 Z" fill-rule="evenodd"/>

            <!-- Stylized 'i' (Cap-height matched, angled slash gap between dot & stem) -->
            <g id="pier-letter-i">
              <!-- Top Slanted Tittle / Dot -->
              <polygon points="449,116 477,116 477,139 449,151"/>
              <!-- Lower Vertical Stem with Matching Diagonal Top Cut -->
              <polygon points="449,165 477,153 477,250 449,250"/>
            </g>

            <!-- Letter 'E' -->
            <path d="M 505 116&#xA;                 L 598 116&#xA;                 L 598 139&#xA;                 L 533 139&#xA;                 L 533 170&#xA;                 L 590 170&#xA;                 L 590 193&#xA;                 L 533 193&#xA;                 L 533 227&#xA;                 L 600 227&#xA;                 L 600 250&#xA;                 L 505 250&#xA;                 Z"/>

            <!-- Letter 'R' -->
            <path d="M 622 116&#xA;                 L 684 116&#xA;                 C 712 116, 729 131, 729 156&#xA;                 C 729 175, 718 189, 700 194&#xA;                 L 733 250&#xA;                 L 701 250&#xA;                 L 672 198&#xA;                 L 650 198&#xA;                 L 650 250&#xA;                 L 622 250&#xA;                 Z&#xA;                 M 650 139&#xA;                 L 650 176&#xA;                 L 681 176&#xA;                 C 694 176, 701 169, 701 157.5&#xA;                 C 701 146, 694 139, 681 139&#xA;                 Z" fill-rule="evenodd"/>
          </g>
        </g>
      </svg>