# Railway deploy config — API service
# The CI workflow copies this file to `railway.toml` before `railway up`,
# so the API service builds the shared Dockerfile and runs uvicorn.
#
# One-time: create a Railway service named `pier-api` (or set the
# RAILWAY_SERVICE_API repo variable to your service name).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "uvicorn piper_agent.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
