# Q1 — PIER QA gate (feat/qa-integracion).
# Complements Elias's ci.yml (master/dev-elias): this one runs on every feat/** branch
# and on PRs, generates the demo cache first, and adds the acceptance suite + the
# Spec §10 report to the job summary.
name: PIER QA

on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIER_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Not (yet) in requirements.txt but imported by the API and the tests.
          pip install fastapi uvicorn httpx pytest

      - name: Generate demo cache (until the loader is cache-first)
        run: |
          if [ -f piper_agent/data/generate_cache.py ]; then
            python piper_agent/data/generate_cache.py
          fi

      - name: Unit + integration tests
        run: python -m pytest tests -q -rxX --ignore=tests/acceptance

      - name: Acceptance tests (Spec §10 + BR invariants)
        run: python -m pytest tests/acceptance -q -rxX

      - name: Success-metrics report (Spec §10)
        run: python scripts/qa/check_success_metrics.py --markdown >> "$GITHUB_STEP_SUMMARY"
