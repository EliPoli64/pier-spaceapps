# Railway deploy config — Streamlit UI service (legacy Config-as-Code, see docs/RAILWAY.md)
# Mirrors services.ui in docker-compose.yml.
# The CI workflow copies this file to `railway.toml` before `railway up`,
# so the UI service builds the shared Dockerfile and runs Streamlit.
#
# One-time: create a Railway service named `ui` (or set the
# RAILWAY_SERVICE_UI repo variable to your service name).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.ui"

[deploy]
startCommand = "streamlit run piper_agent/ui/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
